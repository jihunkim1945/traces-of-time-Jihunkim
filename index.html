          vec2 screenA = clipA.xy / clipA.w * uResolution;
          vec2 screenB = clipB.xy / clipB.w * uResolution;
          vec2 dir = screenB - screenA;
          float dlen = length(dir);
          vec2 normal = dlen > 0.0001 ? vec2(-dir.y, dir.x) / dlen : vec2(0.0, 1.0);

          vec2 offsetPx = normal * (uThickness * 0.5) * aParams.x;
          clipPos.xy += offsetPx * (2.0 / uResolution) * clipPos.w;

          vUv = vec2((aParams.x + 1.0) * 0.5, mix(aURange.x, aURange.y, aParams.y));
          gl_Position = clipPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform sampler2D uMap;
        varying vec2 vUv;
        void main(){
          vec4 tex = texture2D(uMap, vUv);
          gl_FragColor = vec4(uColor * tex.rgb, tex.a * uOpacity);
        }
      `,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      // pushes the thread's tested depth slightly away from the camera
      // at every pixel, so an opaque photo at (effectively) the same
      // depth always wins and covers the overlap, regardless of which
      // was drawn first or which side the camera is viewing from
      polygonOffset: true,
      polygonOffsetFactor: 4,
      polygonOffsetUnits: 4,
    });

    // The depth test above is what gives a thread the clean "runs right up
    // to and into its own photo's edge, no overshoot" look — but with only
    // one shared depth buffer, it can't tell "this thread's own endpoint
    // photo" apart from "some unrelated photo that merely happens to sit
    // between this thread and the camera right now." For a node whose
    // placement (the randomized pull + organic bumps above) lands it off
    // to one side of the main mass, its nearest-neighbor connections often
    // have to cross behind a whole wall of other, unrelated cards — and
    // the depth test then hides the ENTIRE thread behind them, not just
    // the bit touching its own photo. From the camera that reads as "this
    // photo has no thread at all," even though the connection is really
    // there in the data.
    // Fixed by drawing every thread twice: first a faint, low-opacity
    // "ghost" copy with depth testing turned off entirely (so it is never
    // hidden by anything, anywhere), then the normal crisp copy on top.
    // Wherever nothing is in the way — the common case — the crisp copy
    // fully covers the ghost and nothing changes visually. Wherever a
    // thread would otherwise vanish behind unrelated photos, the ghost
    // still shows through as a soft, unbroken red line, so no connection
    // can ever read as a gap.
    const threadGhostMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uResolution: threadMaterial.uniforms.uResolution, // shared refs: thickness/resize updates below apply to both automatically
        uThickness:  threadMaterial.uniforms.uThickness,
        uColor:      threadMaterial.uniforms.uColor,
        uOpacity:    { value: 0.22 },
        uMap:        threadMaterial.uniforms.uMap,
      },
      vertexShader: threadMaterial.vertexShader,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform sampler2D uMap;
        varying vec2 vUv;
        void main(){
          // alpha-only sample (the rounded cross-section falloff) — skips
          // the fiber/highlight shading so the ghost reads as a soft flat
          // glow rather than a second fully-detailed thread
          float a = texture2D(uMap, vUv).a;
          gl_FragColor = vec4(uColor, a * uOpacity);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      side: THREE.DoubleSide,
    });

    const threadGhostMesh = new THREE.Mesh(geo, threadGhostMaterial);
    threadGhostMesh.renderOrder = 0; // always drawn first, so the crisp copy below layers on top of it
    world.add(threadGhostMesh);

    const threadMesh = new THREE.Mesh(geo, threadMaterial);
    threadMesh.renderOrder = 1;
    world.add(threadMesh);
  })();

  // ---- live thread restretching, used by the click-to-focus feature
  // below: recomputes just the handful of sub-segments belonging to one
  // node's connections (using the exact same sag formula buildThreads()
  // used to build them), writing straight into the shared thread
  // geometry's position buffers — so a pulled-out photo's threads visibly
  // stretch to follow it instead of staying anchored to its resting spot.
  function writeCurveToBuffers(startsArr, endsArr, vBase, p, q, bulgeDir, amp){
    const segs = THREAD_SAG_SEGMENTS;
    const curvePts = [];
    for(let k = 0; k <= segs; k++){
      const t = k / segs;
      const taper = Math.sin(t * Math.PI);
      curvePts.push(p.clone().lerp(q, t).addScaledVector(bulgeDir, amp * taper));
    }
    for(let k = 0; k < segs; k++){
      const s = curvePts[k], e = curvePts[k + 1];
      const base = (vBase + k * 4) * 3;
      for(let v = 0; v < 4; v++){
        const idx = base + v * 3;
        startsArr[idx] = s.x; startsArr[idx+1] = s.y; startsArr[idx+2] = s.z;
        endsArr[idx]   = e.x; endsArr[idx+1]   = e.y; endsArr[idx+2]   = e.z;
      }
    }
  }
  function updateNodeThreads(nodeIndex, liveLocalPos){
    const refs = connectionsByNode && connectionsByNode[nodeIndex];
    if(!threadGeo || !refs || !refs.length) return;
    const startsArr = threadGeo.attributes.aStart.array;
    const endsArr = threadGeo.attributes.aEnd.array;
    refs.forEach(ref => {
      const otherPos = nodePositions[ref.otherIndex];
      const p = ref.role === 'p' ? liveLocalPos : otherPos;
      const q = ref.role === 'p' ? otherPos : liveLocalPos;
      writeCurveToBuffers(startsArr, endsArr, ref.vBase, p, q, ref.bulgeDir, ref.amp);
    });
    threadGeo.attributes.aStart.needsUpdate = true;
    threadGeo.attributes.aEnd.needsUpdate = true;
  }

  // ---- camera + grab-to-spin ---------------------------------------
  // The camera itself just sits on one fixed axis and dollies in/out —
  // all the "looking around" comes from spinning the sphere (the
  // `world` group) instead, like grabbing a globe with your hands:
  // drag it and it turns; let go and it keeps turning, slowly losing
  // momentum. It never actually comes to a dead stop, though — once
  // the drag momentum decays down to nothing, a slow idle spin just
  // picks back up and carries it on indefinitely, so it's always
  // gently turning whether or not anyone's touching it.
  const FAR_RADIUS  = 3200; // scroll=0: whole sphere seen as one small, distant form
  const NEAR_RADIUS = 25;   // scroll=1: camera sits essentially at the center
  let currentCamRadius = FAR_RADIUS; // mirrored every frame below; read by the click-to-focus feature further down

  function scrollProgress(){
    const doc = document.documentElement;
    // the hero section (exactly one viewport tall, at the very top of the
    // document) shouldn't count toward this — the dive-in should only
    // start once you've actually scrolled past it into the real content
    const heroH = window.innerHeight;
    const scrollable = Math.max(1, doc.scrollHeight - window.innerHeight - heroH);
    return Math.min(1, Math.max(0, (window.scrollY - heroH) / scrollable));
  }

  // a trackpad pinch (or literal Ctrl+wheel) always shifts this, so you
  // can pull back out even sitting at the very bottom of the scroll —
  // ordinary wheel scrolling (no ctrlKey) is left completely untouched,
  // so it keeps driving the page/corrosion scroll exactly as before
  let zoomOffset = 0;
  const ZOOM_OFFSET_MAX = FAR_RADIUS - NEAR_RADIUS;
  window.addEventListener('wheel', (e) => {
    if(!e.ctrlKey) return;
    if(focusMesh) return; // a focused photo owns the camera distance for the moment
    e.preventDefault();
    zoomOffset = Math.max(0, Math.min(ZOOM_OFFSET_MAX, zoomOffset + e.deltaY * 2.2));
  }, { passive:false });

  const IDLE_SPIN = (Math.PI * 2) / 90; // one slow revolution every 90s, idle-only
  const DRAG_SPEED = 0.0045;
  const MOMENTUM_DAMPING = 0.94; // per-frame decay once released
  const MOMENTUM_FLOOR = 0.00002; // below this (rad/ms) momentum snaps to a stop

  let yaw = 0, pitch = -0.07;     // current spin of the world
  let velYaw = 0, velPitch = 0;   // rad/ms, used for momentum after release
  let dragging = false, lastX = 0, lastY = 0, lastMoveT = 0;

  canvas.addEventListener('pointerdown', (e) => {
    if(focusMesh) return; // a focused photo isn't draggable — click it (or the backdrop) to release it first
    dragging = true;
    velYaw = 0; velPitch = 0;
    lastX = e.clientX; lastY = e.clientY;
    lastMoveT = performance.now();
    canvas.style.cursor = 'grabbing';
  });
  window.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const now = performance.now();
    const dt = Math.max(1, now - lastMoveT);
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    lastMoveT = now;

    const dYaw = dx * DRAG_SPEED;
    const dPitch = dy * DRAG_SPEED;
    yaw += dYaw;
    pitch += dPitch;
    // velocity carried into momentum once the pointer lifts
    velYaw = dYaw / dt;
    velPitch = dPitch / dt;
  });
  window.addEventListener('pointerup', (e) => {
    dragging = false;
    updateHoverCursor(e.clientX, e.clientY);
  });
  canvas.style.cursor = 'grab';

  let lastFrameT = performance.now();
  function animate(now){
    const prog = scrollProgress();
    const camRadius = Math.max(NEAR_RADIUS, Math.min(FAR_RADIUS,
      FAR_RADIUS + (NEAR_RADIUS - FAR_RADIUS) * prog + zoomOffset
    ));
    camera.position.set(0, 0, camRadius);
    camera.lookAt(0, 0, 0);
    currentCamRadius = camRadius;

    if(threadMaterial){
      threadMaterial.uniforms.uThickness.value =
        THREAD_THICKNESS_FAR_PX + (THREAD_THICKNESS_NEAR_PX - THREAD_THICKNESS_FAR_PX) * prog;
    }

    const dt = Math.min(48, now - lastFrameT); // clamp so a stall can't fling it
    lastFrameT = now;

    // a focused photo freezes the sphere's spin entirely — grabbed
    // in place, mid-turn, until it's released — rather than fighting the
    // pulled-out photo's own position/orientation math every frame
    if(!focusMesh){
      if(dragging){
        // position itself is already updated directly in pointermove
      } else if(Math.abs(velYaw) > MOMENTUM_FLOOR || Math.abs(velPitch) > MOMENTUM_FLOOR){
        yaw += velYaw * dt;
        pitch += velPitch * dt;
        velYaw *= MOMENTUM_DAMPING;
        velPitch *= MOMENTUM_DAMPING;
      } else {
        // momentum has fully decayed — rather than sitting dead still,
        // ease into the slow idle spin so it's always gently turning
        velYaw = 0; velPitch = 0;
        yaw += IDLE_SPIN * (dt / 1000);
      }
      world.rotation.set(pitch, yaw, 0);
    }

    tickFocus(now);
    tickHold(now);
    tickDissolveParticles(now);
    tickTravelSparks(now);

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if(threadMaterial) threadMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  });

  // ---- click a photo to pull it to center ------------------------------
  // The clicked photo leaves the spinning `world` group entirely —
  // reparented onto `scene` itself via THREE's attach(), which preserves
  // its current on-screen transform exactly, so nothing jumps at the
  // moment of the click — and animates to a fixed spot in front of the
  // (now frozen) camera. Its threads stay plugged in the whole time:
  // updateNodeThreads() keeps re-stretching them toward wherever the
  // photo currently sits, every frame, so the connection to the rest of
  // the web is never lost, only pulled taut. No caption, no text — just
  // the photo itself, its own corrosion treatment deepening as it
  // approaches center and blooming into color in the final stretch.
  const FOCUS_DURATION = 820;          // ms, one-way
  const FOCUS_SCREEN_FRACTION = 0.58;  // ~58% of viewport height once centered

  let focusMesh = null, focusIndex = -1;
  let focusProgress = 0, focusAnimFrom = 0, focusAnimTarget = 0, focusAnimStart = 0, focusAnimating = false;
  let focusWorldInverse = null; // world's (frozen, while focused) inverse matrix — projects the live scene-space position back into the thread geometry's local space
  let focusOrigin = null, focusOriginQuat = null, focusOriginScale = null, focusTargetPos = null, focusTargetScale = null;

  function easeInOutCubic(t){
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }
  function lockScroll(){
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  }
  function unlockScroll(){
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }

  function ensureFocusCanvas(mesh){
    if(mesh.userData.focusTex) return;
    const photoImg = mesh.userData.photoImg;
    if(!photoImg) return;
    const w = photoImg.naturalWidth || photoImg.width;
    const h = photoImg.naturalHeight || photoImg.height;
    const fc = document.createElement('canvas');
    fc.width = w; fc.height = h;
    const tex = new THREE.CanvasTexture(fc);
    tex.encoding = THREE.sRGBEncoding;
    mesh.userData.focusCanvas = fc;
    mesh.userData.focusCtx = fc.getContext('2d');
    mesh.userData.focusTex = tex;
  }
  function redrawFocusCanvas(mesh, progress){
    const { focusCtx: ctx, focusCanvas: fc, focusTex: tex, photoImg, overlayImg, overlayParams } = mesh.userData;
    if(!ctx) return;
    drawPhotoFrame(ctx, fc.width, fc.height, photoImg, overlayImg, overlayParams, progress);
    tex.needsUpdate = true;
  }
  function disposeFocusCanvas(mesh){
    if(mesh.userData.focusTex) mesh.userData.focusTex.dispose();
    mesh.userData.focusTex = null;
    mesh.userData.focusCanvas = null;
    mesh.userData.focusCtx = null;
  }

  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  const CLICK_MAX_MOVE = 6; // px of movement allowed before a RELEASE reads as a drag instead of a quick click — fine for that, since a real click is over in well under a second
  const HOLD_MAX_DRIFT = 26; // px of movement allowed DURING an in-progress hold before it cancels as a drag — a hold runs 1-1.7s+, and no real hand (mouse, trackpad, or finger) stays within 6px for that whole span, so reusing CLICK_MAX_MOVE here was silently canceling and restarting the charge on ordinary hand tremor, before it could ever finish

  // ---------- hold-to-dissolve ----------
  // press and hold a photo: its own corrosion overlay accelerates (reusing
  // the exact same darken+color-bloom progression as click-to-focus, via
  // ensureFocusCanvas/redrawFocusCanvas on the mesh's regular, in-sphere
  // material — no need for it to be pulled to center first), and once held
  // long enough it dissolves into a drifting particle cloud sampled from
  // its own (already color-shifted) pixels. Its thread connections are
  // untouched by any of this — they're built from the node's fixed base
  // position, which never moves here, so they simply keep pointing at
  // where the photo used to be the whole time it's gone. The photo's own
  // image reappears immediately as a small color-shifted stamp on a random
  // other photo, then the original spot slowly regrows on its own after a
  // cooldown.
  const HOLD_CHARGE_DELAY = 600;            // ms of holding before it visibly starts charging — below this always reads as a plain click, however long the click itself took
  const HOLD_DISSOLVE_AT = 1700;            // ms of total hold before it fully dissolves
  const HOLD_FADE_DOWN = 250;               // ms spent fading an already-focused (fully bloomed) photo back down to faint before it climbs again — so the whole faint->darker->color-shift arc is visible during the hold instead of starting from a look that's already maxed out
  const DISSOLVE_REGROW_DELAY = 14000;      // ms the spot stays empty before regrowing
  const DISSOLVE_REGROW_DURATION = 2600;    // ms for the regrow fade/scale-in itself
  const DISSOLVE_GRID = 18;                 // cols/rows of particles sampled from the photo
  const DISSOLVE_LIFETIME = 1600;           // ms the particle burst itself lasts

  let holdCandidate = null; // { mesh, startX, startY, t }
  let lastPointerX = 0, lastPointerY = 0;
  let activeDissolves = [];
  let activeTravels = [];

  window.addEventListener('pointermove', (e) => { lastPointerX = e.clientX; lastPointerY = e.clientY; });

  function revertCharge(mesh){
    mesh.userData.dissolveState = undefined;
    if(mesh.userData.holdWasFocused){
      // this canvas belongs to a focus session that's still open — it's
      // not hold's to swap or dispose, just settle back to the normal
      // fully-focused look
      mesh.userData.holdWasFocused = false;
      if(mesh.userData.focusTex) redrawFocusCanvas(mesh, 1);
      return;
    }
    if(mesh.userData.bakedMapBeforeHold){
      mesh.material.map = mesh.userData.bakedMapBeforeHold;
      mesh.material.needsUpdate = true;
      mesh.userData.bakedMapBeforeHold = null;
    }
    disposeFocusCanvas(mesh);
  }

  function cancelHold(){
    if(!holdCandidate) return;
    const { mesh } = holdCandidate;
    holdCandidate = null;
    if(mesh.userData.dissolveState === 'charging') revertCharge(mesh);
  }

  function spawnDissolveParticles(mesh){
    // sample the photo's OWN original colors, not the charge-darkened
    // canvas — the darkened look reads fine as a flat overlay on the
    // plane, but as scattered points against the busy thread/photo
    // backdrop it's too dark and muted to read as "particles" at all
    const srcImg = mesh.userData.photoImg || mesh.userData.focusCanvas || mesh.userData.bakedCanvas;
    if(!srcImg) return;
    const cols = DISSOLVE_GRID, rows = DISSOLVE_GRID;
    const sampleCanvas = document.createElement('canvas');
    sampleCanvas.width = cols; sampleCanvas.height = rows;
    const sctx = sampleCanvas.getContext('2d');
    sctx.drawImage(srcImg, 0, 0, cols, rows);
    const data = sctx.getImageData(0, 0, cols, rows).data;

    const count = cols * rows;
    const positions = new Float32Array(count * 3);
    const velocities = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const outward = mesh.position.clone().normalize(); // mesh is a direct child of `world`, same basis as nodePositions
    // velocities are scaled to the photo's own size (nodeBaseSize varies
    // ~60-150 world units across photos, and the sphere itself spans
    // hundreds of units) — a fixed small constant here would either be
    // imperceptible on a large photo or wildly overshoot a small one
    const sizeScale = Math.max(mesh.scale.x, mesh.scale.y);

    let p = 0;
    for(let ry = 0; ry < rows; ry++){
      for(let cx = 0; cx < cols; cx++){
        const u = (cx + 0.5) / cols, v = (ry + 0.5) / rows;
        const lx = (u - 0.5) * mesh.scale.x;
        const ly = (0.5 - v) * mesh.scale.y; // image v grows downward, plane +Y grows upward
        positions[p*3+0] = mesh.position.x + lx;
        positions[p*3+1] = mesh.position.y + ly;
        positions[p*3+2] = mesh.position.z;

        const jx = (Math.random()*2-1), jy = (Math.random()*2-1), jz = (Math.random()*2-1);
        const speed = sizeScale * (0.006 + Math.random() * 0.012);
        const jitter = sizeScale * 0.004;
        velocities[p*3+0] = outward.x * speed + jx * jitter;
        velocities[p*3+1] = outward.y * speed + jy * jitter + sizeScale * 0.004; // gentle upward smoke drift
        velocities[p*3+2] = outward.z * speed + jz * jitter;

        const di = (ry * cols + cx) * 4;
        // a mild brightness lift — a dissolving ember/dust mote reads
        // better a touch brighter than the flat source pixel, especially
        // against the dark, busy thread network behind it
        colors[p*3+0] = Math.min(1, (data[di]   / 255) * 1.25 + 0.05);
        colors[p*3+1] = Math.min(1, (data[di+1] / 255) * 1.25 + 0.05);
        colors[p*3+2] = Math.min(1, (data[di+2] / 255) * 1.25 + 0.05);
        p++;
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    // fixed pixel size (sizeAttenuation:false), not a world-space size —
    // the camera's distance to the sphere varies hugely with scroll
    // (NEAR_RADIUS 25 to FAR_RADIUS 3200), and a world-space dot sized
    // relative to the photo itself would shrink to sub-pixel and vanish
    // whenever the view is zoomed out
    const baseSize = 9;
    const mat = new THREE.PointsMaterial({
      size: baseSize,
      vertexColors: true,
      transparent: true,
      opacity: 1,
      depthWrite: false,
      sizeAttenuation: false,
    });
    const points = new THREE.Points(geo, mat);
    world.add(points); // same rotating frame the photo itself lived in

    activeDissolves.push({ points, geo, mat, velocities, startT: performance.now(), baseSize, sizeScale });
  }

  function tickDissolveParticles(now){
    if(!activeDissolves.length) return;
    activeDissolves = activeDissolves.filter((d) => {
      const t = (now - d.startT) / DISSOLVE_LIFETIME;
      if(t >= 1){
        world.remove(d.points);
        d.geo.dispose();
        d.mat.dispose();
        return false;
      }
      const arr = d.geo.attributes.position.array;
      const lift = d.sizeScale * 0.00025; // slight upward acceleration — rising smoke
      for(let i = 0; i < arr.length; i += 3){
        arr[i]   += d.velocities[i];
        arr[i+1] += d.velocities[i+1];
        arr[i+2] += d.velocities[i+2];
        d.velocities[i+1] += lift;
      }
      d.geo.attributes.position.needsUpdate = true;
      d.mat.opacity = Math.max(0, Math.pow(1 - t, 0.6)); // stays visible longer, then drops off near the end
      d.mat.size = d.baseSize * (1 + t * 1.1); // particles expand as they dissipate, more subtly than before
      return true;
    });
  }

  // a small comet-stream of the dissolving photo's own sampled colors,
  // launched the instant a dissolve triggers and arriving right as the
  // stamp (see stampImageOnto, STAMP_FADE_MS) finishes fading onto the
  // target photo — without this, particles just scatter in place and there
  // is no visible answer to "where did it go", which was the main complaint
  const TRAVEL_DURATION = 900; // matches STAMP_FADE_MS so arrival lines up with the stamp appearing
  const TRAVEL_COUNT = 30;

  function spawnTravelSparks(mesh, targetMesh){
    const srcImg = mesh.userData.photoImg || mesh.userData.focusCanvas || mesh.userData.bakedCanvas;
    const start = mesh.position.clone();
    const end = targetMesh.position.clone();
    const count = TRAVEL_COUNT;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const startOffsets = new Float32Array(count * 3); // scatter around the source photo at launch
    const delays = new Float32Array(count);            // staggered launch so it reads as a stream, not one lockstep clump

    let sampleData = null;
    if(srcImg){
      const sc = document.createElement('canvas');
      sc.width = 6; sc.height = 6;
      sc.getContext('2d').drawImage(srcImg, 0, 0, 6, 6);
      sampleData = sc.getContext('2d').getImageData(0, 0, 6, 6).data;
    }

    const sizeScale = Math.max(mesh.scale.x, mesh.scale.y, 1);
    for(let i = 0; i < count; i++){
      const ox = (Math.random()*2-1) * sizeScale * 0.35;
      const oy = (Math.random()*2-1) * sizeScale * 0.35;
      const oz = (Math.random()*2-1) * sizeScale * 0.08;
      startOffsets[i*3+0] = ox; startOffsets[i*3+1] = oy; startOffsets[i*3+2] = oz;
      delays[i] = Math.random() * 0.3;
      positions[i*3+0] = start.x + ox;
      positions[i*3+1] = start.y + oy;
      positions[i*3+2] = start.z + oz;
      if(sampleData){
        const px = Math.floor(Math.random()*6), py = Math.floor(Math.random()*6);
        const di = (py*6+px)*4;
        colors[i*3+0] = Math.min(1, (sampleData[di]   / 255) * 1.3 + 0.1);
        colors[i*3+1] = Math.min(1, (sampleData[di+1] / 255) * 1.3 + 0.1);
        colors[i*3+2] = Math.min(1, (sampleData[di+2] / 255) * 1.3 + 0.1);
      } else {
        colors[i*3+0] = 0.85; colors[i*3+1] = 0.5; colors[i*3+2] = 0.3;
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 8,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      sizeAttenuation: false,
    });
    const points = new THREE.Points(geo, mat);
    world.add(points); // same rotating frame both photos live in

    activeTravels.push({ points, geo, mat, start, end, startOffsets, delays, startT: performance.now() });
  }

  function tickTravelSparks(now){
    if(!activeTravels.length) return;
    activeTravels = activeTravels.filter((d) => {
      const t = (now - d.startT) / TRAVEL_DURATION;
      if(t >= 1){
        world.remove(d.points);
        d.geo.dispose();
        d.mat.dispose();
        return false;
      }
      const arr = d.geo.attributes.position.array;
      const dx = d.end.x - d.start.x, dy = d.end.y - d.start.y, dz = d.end.z - d.start.z;
      const n = d.startOffsets.length / 3;
      for(let i = 0; i < n; i++){
        const localT = Math.max(0, Math.min(1, (t - d.delays[i]) / (1 - d.delays[i])));
        const ease = localT * localT * (3 - 2 * localT); // smoothstep
        arr[i*3+0] = d.start.x + d.startOffsets[i*3+0] * (1 - ease) + dx * ease;
        arr[i*3+1] = d.start.y + d.startOffsets[i*3+1] * (1 - ease) + dy * ease;
        arr[i*3+2] = d.start.z + d.startOffsets[i*3+2] * (1 - ease) + dz * ease;
      }
      d.geo.attributes.position.needsUpdate = true;
      // fades in fast at launch, cruises bright, fades out just before
      // arrival so it doesn't visibly "pop" into the target photo
      d.mat.opacity = Math.min(1, t * 6) * Math.min(1, (1 - t) * 4);
      return true;
    });
  }

  function startRegrow(mesh){
    if(mesh.userData.dissolveState !== 'gone') return; // defensive — state already moved on somehow
    mesh.userData.dissolveState = 'regrowing';
    if(mesh.userData.bakedTex){
      mesh.material.map = mesh.userData.bakedTex; // carries any stamps received while it was gone
      mesh.material.needsUpdate = true;
    }
    mesh.visible = true;
    mesh.material.transparent = true;
    mesh.material.needsUpdate = true;
    mesh.material.opacity = 0;
    mesh.scale.set(0.001, 0.001, 1);
    const fullX = mesh.userData.fullScaleX, fullY = mesh.userData.fullScaleY;
    const startT = performance.now();
    (function anim(){
      const t = Math.min(1, (performance.now() - startT) / DISSOLVE_REGROW_DURATION);
      const eased = easeInOutCubic(t);
      mesh.scale.set(fullX * eased, fullY * eased, 1);
      mesh.material.opacity = eased;
      if(t < 1){
        requestAnimationFrame(anim);
      } else {
        mesh.material.transparent = false;
        mesh.material.opacity = 1;
        mesh.material.needsUpdate = true;
        mesh.userData.dissolveState = undefined;
      }
    })();
  }

  // when the photo dissolving is the one currently pulled to center, the
  // focus session has nothing left to show — end it the same way a normal
  // close would (thread back at rest, scroll unlocked, mesh back in the
  // `world` group at its own sphere position — matching exactly what
  // spawnDissolveParticles and the later regrow both assume), just without
  // the close-animation tween, since there's no photo left to animate
  function releaseFocusOnDissolve(mesh, i){
    world.attach(mesh);
    mesh.position.copy(nodePositions[i]);
    if(focusOriginQuat) mesh.quaternion.copy(focusOriginQuat);
    if(focusOriginScale) mesh.scale.copy(focusOriginScale);
    updateNodeThreads(i, nodePositions[i]);
    unlockScroll();
    focusMesh = null;
    focusIndex = -1;
    focusWorldInverse = null;
    focusAnimating = false;
    focusProgress = 0;
  }

  function triggerDissolve(mesh){
    if(mesh.userData.dissolveState === 'gone') return;
    mesh.userData.dissolveState = 'gone';
    holdCandidate = null;

    const target = pickRandomOtherMesh(mesh.userData.index);
    if(target && mesh.userData.photoImg) stampImageOnto(target, mesh.userData.photoImg);

    // reparent back to the sphere (if it was focused) BEFORE spawning the
    // particle burst — spawnDissolveParticles reads mesh.position/scale
    // assuming `world`-local sphere coordinates
    if(mesh === focusMesh) releaseFocusOnDissolve(mesh, mesh.userData.index);

    spawnDissolveParticles(mesh);
    if(target) spawnTravelSparks(mesh, target);

    mesh.visible = false;
    disposeFocusCanvas(mesh);
    mesh.userData.bakedMapBeforeHold = null;
    mesh.userData.holdWasFocused = false;

    setTimeout(() => startRegrow(mesh), DISSOLVE_REGROW_DELAY);
  }

  function tickHold(now){
    if(!holdCandidate) return;
    const { mesh, startX, startY, t } = holdCandidate;
    const dist = Math.hypot(lastPointerX - startX, lastPointerY - startY);
    if(dist > HOLD_MAX_DRIFT){ cancelHold(); return; } // turned into a genuine drag, not just hand tremor over a long hold
    if(mesh.userData.dissolveState === 'gone' || mesh.userData.dissolveState === 'regrowing'){
      cancelHold();
      return;
    }
    const elapsed = now - t;
    if(elapsed < HOLD_CHARGE_DELAY) return; // still plain click territory, no visual yet

    const isFocused = (mesh === focusMesh);

    if(mesh.userData.dissolveState !== 'charging'){
      mesh.userData.dissolveState = 'charging';
      mesh.userData.holdWasFocused = isFocused;
      if(!isFocused){
        ensureFocusCanvas(mesh);
        if(mesh.userData.focusTex){
          mesh.userData.bakedMapBeforeHold = mesh.material.map;
          mesh.material.map = mesh.userData.focusTex;
          mesh.material.needsUpdate = true;
        }
      }
      // if isFocused, the open focus session already owns focusTex/
      // focusCanvas and material.map already points at it — nothing to
      // swap, redrawFocusCanvas below just keeps drawing onto it
    }

    const sinceCharge = elapsed - HOLD_CHARGE_DELAY;
    let progress, climbing;
    if(isFocused){
      // an already-focused photo is sitting at drawPhotoFrame's own
      // progress=1 (its fully-bloomed resting look) — holding it visibly
      // fades that back down to faint first, then climbs back up through
      // the exact same intensify/color-shift arc toward dissolving, so
      // the full faint -> darker -> color-shift -> gone sequence actually
      // plays out instead of starting from a look that's already maxed
      if(sinceCharge < HOLD_FADE_DOWN){
        progress = 1 - (sinceCharge / HOLD_FADE_DOWN);
        climbing = false;
      } else {
        const climbDur = HOLD_DISSOLVE_AT - HOLD_CHARGE_DELAY - HOLD_FADE_DOWN;
        progress = Math.min(1, (sinceCharge - HOLD_FADE_DOWN) / climbDur);
        climbing = true;
      }
    } else {
      progress = Math.min(1, sinceCharge / (HOLD_DISSOLVE_AT - HOLD_CHARGE_DELAY));
      climbing = true;
    }
    redrawFocusCanvas(mesh, progress);
    if(climbing && progress >= 1) triggerDissolve(mesh);
  }

  function openFocus(i){
    if(focusMesh) return;
    const mesh = meshes[i];
    if(!mesh || !mesh.userData.photoImg) return;

    focusIndex = i;
    focusMesh = mesh;

    world.updateMatrixWorld(true);
    focusWorldInverse = new THREE.Matrix4().copy(world.matrixWorld).invert();

    scene.attach(mesh); // reparents onto the scene root, preserving its current on-screen transform exactly

    focusOrigin = mesh.position.clone();
    focusOriginQuat = mesh.quaternion.clone(); // the true original — kept only to restore exactly on close
    focusOriginScale = mesh.scale.clone();

    // face the camera head-on right away, before the very first frame of
    // the transition ever renders — not animated, so there's no visible
    // "spin", it's simply already front-facing as it starts moving forward
    mesh.quaternion.identity();

    const targetDist = Math.max(60, Math.min(currentCamRadius * 0.55, 420));
    focusTargetPos = new THREE.Vector3(0, 0, currentCamRadius - targetDist);

    const fovRad = camera.fov * Math.PI / 180;
    const visibleHeight = 2 * Math.tan(fovRad / 2) * targetDist;
    const desiredH = visibleHeight * FOCUS_SCREEN_FRACTION;
    const aspect = focusOriginScale.x / focusOriginScale.y;
    focusTargetScale = new THREE.Vector3(desiredH * aspect, desiredH, 1);

    ensureFocusCanvas(mesh);
    mesh.userData.bakedMap = mesh.material.map;
    if(mesh.userData.focusTex){
      mesh.material.map = mesh.userData.focusTex;
      mesh.material.needsUpdate = true;
      redrawFocusCanvas(mesh, 0);
    }

    lockScroll();
    animateFocus(1);
  }

  function closeFocus(){
    if(!focusMesh || focusAnimTarget === 0) return;
    animateFocus(0);
  }

  function animateFocus(target){
    focusAnimFrom = focusProgress;
    focusAnimTarget = target;
    focusAnimStart = performance.now();
    focusAnimating = true;
  }

  function applyFocusProgress(p){
    const mesh = focusMesh;
    if(!mesh) return;

    mesh.position.lerpVectors(focusOrigin, focusTargetPos, p);
    mesh.scale.lerpVectors(focusOriginScale, focusTargetScale, p);
    // orientation is left exactly as it was — no reorientation/"spin" as
    // it approaches, only a straight move-and-scale toward the viewer
    const liveLocalPos = mesh.position.clone().applyMatrix4(focusWorldInverse);
    updateNodeThreads(focusIndex, liveLocalPos);

    if(mesh.userData.focusTex) redrawFocusCanvas(mesh, p);
  }

  function finishCloseFocus(){
    const mesh = focusMesh, i = focusIndex;
    mesh.position.copy(focusOrigin);
    mesh.quaternion.copy(focusOriginQuat);
    mesh.scale.copy(focusOriginScale);
    world.attach(mesh); // back into the spinning group — local transform restored to match nodePositions[i] exactly

    updateNodeThreads(i, nodePositions[i]);
    if(mesh.userData.bakedMap){
      mesh.material.map = mesh.userData.bakedMap;
      mesh.material.needsUpdate = true;
    }
    disposeFocusCanvas(mesh);
    unlockScroll();

    focusMesh = null;
    focusIndex = -1;
    focusWorldInverse = null;
  }

  function tickFocus(now){
    if(!focusAnimating) return;
    const t = Math.min(1, (now - focusAnimStart) / FOCUS_DURATION);
    const eased = easeInOutCubic(t);
    focusProgress = focusAnimFrom + (focusAnimTarget - focusAnimFrom) * eased;
    applyFocusProgress(focusProgress);
    if(t >= 1){
      focusAnimating = false;
      if(focusAnimTarget === 0) finishCloseFocus();
    }
  }

  let clickStart = null;

  function raycastMesh(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -(((clientY - rect.top) / rect.height) * 2 - 1);
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects(meshes, false);
    return hits.length ? hits[0].object : null;
  }

  // the only feedback a mouse user gets, before ever pressing down, that a
  // photo is something they can click (to open) or hold (to dissolve) — a
  // hand cursor exactly over a live mesh, same hero-banner exclusion as the
  // pointerdown handler below so the ray never "sees" sphere photos sitting
  // behind the still-opaque hero intro
  function updateHoverCursor(clientX, clientY){
    if(dragging){ canvas.style.cursor = 'grabbing'; return; }
    const topEl = document.elementFromPoint(clientX, clientY);
    if(topEl && topEl.closest && (topEl.closest('#hero') || topEl.closest('#bgm-toggle'))){
      canvas.style.cursor = focusMesh ? 'default' : 'grab';
      return;
    }
    const hit = raycastMesh(clientX, clientY);
    const interactive = hit && !hit.userData.dissolveState && (!focusMesh || hit === focusMesh);
    canvas.style.cursor = interactive ? 'pointer' : (focusMesh ? 'default' : 'grab');
  }
  window.addEventListener('pointermove', (e) => {
    updateHoverCursor(e.clientX, e.clientY);
  }, { passive:true });

  // listening on `window`, not just the canvas: #page-wrap's text column
  // (.content) sits ON TOP of the canvas with pointer-events:auto (so it
  // stays selectable — see the comment on #page-wrap above), which covers
  // a good chunk of screen-center at every scroll depth, INCLUDING exactly
  // where a focused photo always sits once pulled to center. A listener
  // scoped to the canvas element itself never even sees a press that
  // landed on that overlapping text column, so clicking or holding
  // anywhere near the middle of the screen could silently do nothing.
  // Raycasting purely from clientX/clientY (not from e.target) sidesteps
  // that entirely — it doesn't matter which DOM element the browser
  // decided "received" the press, only where the ray actually lands.
  window.addEventListener('pointerdown', (e) => {
    // the one place this SHOULD stay inert: the hero banner's own opaque
    // intro scene, genuinely on top for the first couple of viewports.
    // The photo sphere can still be inside the camera frustum behind it
    // (it's just a different scene on the same shared camera), so without
    // this check a press on the hero title could raycast-hit a sphere
    // photo nobody can actually see yet.
    const topEl = document.elementFromPoint(e.clientX, e.clientY);
    if(topEl && topEl.closest && (topEl.closest('#hero') || topEl.closest('#bgm-toggle'))) return;

    clickStart = { x: e.clientX, y: e.clientY, t: performance.now() };
    if(focusAnimating) return;
    const hit = raycastMesh(e.clientX, e.clientY);
    if(!hit || hit.userData.dissolveState) return;
    // while a photo is focused (pulled to center), only holding THAT SAME
    // photo can charge a dissolve — pressing elsewhere is left alone, so
    // pointerup's existing "any clean click away closes focus" still runs
    if(focusMesh && hit !== focusMesh) return;
    holdCandidate = { mesh: hit, startX: e.clientX, startY: e.clientY, t: performance.now() };
  });
  window.addEventListener('pointerup', (e) => {
    // was this release ending a hold that had ALREADY started visibly
    // charging (past HOLD_CHARGE_DELAY)? capture that before cancelHold()
    // reverts the charge and clears holdCandidate — an ordinary click,
    // however long the click itself happened to take, should still open
    // the photo; only a hold that visibly began corroding should not
    const wasCharging = !!(holdCandidate && holdCandidate.mesh.userData.dissolveState === 'charging');
    cancelHold();
    if(!clickStart) return;
    const dx = e.clientX - clickStart.x, dy = e.clientY - clickStart.y;
    const dist = Math.hypot(dx, dy);
    clickStart = null;
    if(dist > CLICK_MAX_MOVE) return; // was a drag, not a click
    if(wasCharging) return; // a deliberate hold that was released early — already reverted above, not a click
    if(focusAnimating) return;

    if(focusMesh){
      closeFocus(); // any clean click while a photo is focused releases it
      updateHoverCursor(e.clientX, e.clientY);
      return;
    }
    const hit = raycastMesh(e.clientX, e.clientY);
    if(hit && !hit.userData.dissolveState) openFocus(hit.userData.index);
    updateHoverCursor(e.clientX, e.clientY);
  });
  window.addEventListener('keydown', (e) => {
    // don't let Escape yank the focus session closed out from under an
    // actively-charging hold on that same photo — releasing the hold (or
    // letting it finish dissolving) settles it first
    if(e.key === 'Escape' && focusMesh && !focusAnimating && !(holdCandidate && holdCandidate.mesh === focusMesh)) closeFocus();
  });
})();

// ===================================================================
// Corrosion-mask reveal — the WHITE PAGE SURFACE corrodes open as you
// scroll, letting the (always-running) image network show through the
// growing holes. The paragraphs themselves never change — only the
// backdrop behind/around them.
//
// Performance approach: instead of redrawing pixels every scroll frame,
// a small set of tileable corrosion-pattern frames is pre-rendered ONCE
// at load (cheap canvas work, done off the scroll path), each one a bit
// more "eaten through" than the last. Scrolling only swaps which
// pre-built frame is shown, and only when you've crossed into the next
// frame's range — so the per-scroll-event cost is a couple of cheap
// comparisons, not a pixel loop.
// ===================================================================
(function(){
  const pageWrap = document.getElementById('page-wrap');
  const corrosionBg = document.getElementById('corrosion-bg');
  const TILE_PX   = 720;
  const TILE_RES  = 280;
  const FRAMES    = 22;
  const EDGE_BAND = 0.045;

  // rust bloom: white paper -> pale warm blush -> burnt orange -> deep
  // rust red-brown -> near-black, right at the rim before it opens through
  const RUST_STOPS = [
    { pos:0.00, rgb:[255,255,255] },
    { pos:0.22, rgb:[255,214,168] },
    { pos:0.50, rgb:[198,92,42]   },
    { pos:0.80, rgb:[122,36,24]   },
    { pos:1.00, rgb:[60,18,14]    }
  ];
  function rustColor(bandPos){
    for(let i=0;i<RUST_STOPS.length-1;i++){
      const a = RUST_STOPS[i], b = RUST_STOPS[i+1];
      if(bandPos <= b.pos){
        const f = (bandPos - a.pos) / (b.pos - a.pos || 1);
        return [
          a.rgb[0] + (b.rgb[0]-a.rgb[0])*f,
          a.rgb[1] + (b.rgb[1]-a.rgb[1])*f,
          a.rgb[2] + (b.rgb[2]-a.rgb[2])*f
        ];
      }
    }
    return RUST_STOPS[RUST_STOPS.length-1].rgb;
  }

  function makeGrid(cells){
    const g = new Float32Array(cells*cells);
    for(let i=0;i<g.length;i++) g[i] = Math.random();
    return g;
  }
  function sampleGrid(g, cells, u, v){
    const x = u*cells, y = v*cells;
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x-x0, fy = y-y0;
    const xi0 = ((x0%cells)+cells)%cells, yi0 = ((y0%cells)+cells)%cells;
    const xi1 = (xi0+1)%cells, yi1 = (yi0+1)%cells;
    const gv = (xx,yy)=> g[yy*cells+xx];
    const top = gv(xi0,yi0)*(1-fx) + gv(xi1,yi0)*fx;
    const bot = gv(xi0,yi1)*(1-fx) + gv(xi1,yi1)*fx;
    return top*(1-fy) + bot*fy;
  }

  // field/dither/colorNoise/sweepHigh/sweepLow are filled in by buildTiles()
  // below, then kept here (rather than staying local to it) so the idle
  // crawl can later render extra one-off frames at an arbitrary in-between
  // threshold — not just the 22 precomputed ones — using the exact same
  // noise field and coloring rules.
  let field = null, dither = null, colorNoise = null, sweepHigh = 0, sweepLow = 0;

  // renders one corrosion frame at an arbitrary threshold (not necessarily
  // one of the 22 precomputed stops) against the shared noise field —
  // the same per-pixel rule buildTiles() sweeps across all 22 frames,
  // factored out so the idle crawl can call it for a single in-between
  // frame without rebuilding the whole set.
  function renderCorrosionFrame(threshold, forceFullyOpen){
    const canvas = document.createElement('canvas');
    canvas.width = TILE_RES; canvas.height = TILE_RES;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(TILE_RES, TILE_RES);
    const state = new Uint8Array(TILE_RES*TILE_RES);
    for(let i=0;i<TILE_RES*TILE_RES;i++){
      let r=255, g=255, b=255, alpha;
      if(forceFullyOpen){
        alpha = 0;
        state[i] = 0;
      } else{
        const n = field[i];
        if(n > threshold + EDGE_BAND){
          alpha = 0; // fully open — the hole itself stays clean/transparent
          state[i] = 0;
        } else if(n < threshold - EDGE_BAND){
          alpha = 255; // untouched white paper, well away from any edge
          state[i] = 2;
        } else{
          state[i] = 1; // active frontier, whichever way the dither below falls
          const bandPos = (n - (threshold-EDGE_BAND)) / (EDGE_BAND*2); // 0..1
          if(dither[i] < bandPos){
            alpha = 0;
          } else {
            alpha = 255;
            const jitter = 0.85 + colorNoise[i]*0.3;
            const c = rustColor(bandPos);
            r = Math.min(255, c[0]*jitter);
            g = Math.min(255, c[1]*jitter);
            b = Math.min(255, c[2]*jitter);
          }
        }
      }
      const o = i*4;
      imgData.data[o]=r; imgData.data[o+1]=g; imgData.data[o+2]=b; imgData.data[o+3]=alpha;
    }
    ctx.putImageData(imgData, 0, 0);
    return { url: canvas.toDataURL('image/png'), state };
  }

  // maps a 0..1 sweep position to the same threshold buildTiles() uses for
  // its discrete frames — shared so a one-off in-between frame lines up
  // exactly with where the 22 precomputed frames sit on the same sweep
  function thresholdAt(t){
    return sweepHigh - t*(sweepHigh - sweepLow);
  }

  function buildTiles(){
    // four octaves at non-aligned cell counts (4, 9, 19, 37 — no shared
    // factors) so their blob shapes never line up into a regular lattice;
    // this is what made the holes look "too even" before — only two
    // octaves, both landing on a simple repeating grid feel
    const OCTAVES = [
      { cells:4,  weight:0.40 },
      { cells:9,  weight:0.27 },
      { cells:19, weight:0.19 },
      { cells:37, weight:0.14 }
    ];
    const grids = OCTAVES.map(o => makeGrid(o.cells));

    // one fixed noise field, reused for every frame — holes only ever
    // grow as the threshold is lowered, never flicker or relocate
    field = new Float32Array(TILE_RES*TILE_RES);
    let fieldMin = Infinity, fieldMax = -Infinity;
    for(let y=0;y<TILE_RES;y++){
      for(let x=0;x<TILE_RES;x++){
        const u = x/TILE_RES, v = y/TILE_RES;
        let n = 0;
        for(let o=0;o<OCTAVES.length;o++){
          n += sampleGrid(grids[o], OCTAVES[o].cells, u, v) * OCTAVES[o].weight;
        }
        field[y*TILE_RES+x] = n;
        if(n < fieldMin) fieldMin = n;
        if(n > fieldMax) fieldMax = n;
      }
    }
    // stable per-pixel dither so the transition band looks like grain,
    // not a smooth grey gradient — this is the "particle" texture at
    // the corroding edge, baked in rather than animated live
    dither = new Float32Array(TILE_RES*TILE_RES);
    for(let i=0;i<dither.length;i++) dither[i] = Math.random();
    // a second, independent noise for color jitter so the rust bloom reads
    // as mottled texture rather than a flat smooth gradient
    colorNoise = new Float32Array(TILE_RES*TILE_RES);
    for(let i=0;i<colorNoise.length;i++) colorNoise[i] = Math.random();

    // calibrate the sweep against this exact field's actual range (rather
    // than a hardcoded number) so it stays an even 0%→100% progression no
    // matter how the octaves above get tuned later
    const pad = (fieldMax - fieldMin) * 0.04;
    sweepHigh = fieldMax + pad; sweepLow = fieldMin - pad;

    const urls = [];
    const states = []; // per-frame classification (0 open / 1 band / 2 solid),
                        // kept alongside the images so the dust system below
                        // can find "where the active rust edge currently is"
                        // without re-reading pixels back out of a PNG
    for(let fIdx=0; fIdx<FRAMES; fIdx++){
      const t = fIdx/(FRAMES-1);
      // the very last frame is forced fully open, no matter what the
      // threshold math works out to — scrolling all the way down must
      // always end on a completely clean, unobstructed image network,
      // never a few stray leftover white/rust specks sitting on top of it
      const forceFullyOpen = (fIdx === FRAMES-1);
      const { url, state } = renderCorrosionFrame(thresholdAt(t), forceFullyOpen);
      urls.push(url);
      states.push(state);
    }
    return { urls, states };
  }

  // ---- dust: a small burst of fading debris puffs off the active rust
  // band each time the scroll crosses into a new frame. Spawning only
  // happens on that same quantized frame-change event (not every scroll
  // pixel), and the animation loop only runs for the ~1s a burst is alive,
  // then stops itself — so this stays just as cheap as everything above.
  const dustCanvas = document.getElementById('dust-canvas');
  const dustCtx = dustCanvas.getContext('2d');
  let dustParticles = [];
  let dustAnimating = false;
  let dustDPR = Math.min(2, window.devicePixelRatio || 1);

  function sizeDustCanvas(){
    dustDPR = Math.min(2, window.devicePixelRatio || 1);
    dustCanvas.width = window.innerWidth * dustDPR;
    dustCanvas.height = window.innerHeight * dustDPR;
    dustCtx.setTransform(dustDPR, 0, 0, dustDPR, 0, 0);
  }
  sizeDustCanvas();

  function spawnDustParticle(x, y){
    dustParticles.push({
      x, y,
      vx: (Math.random()*2-1) * 34,
      vy: -(22 + Math.random()*68),
      size: 1 + Math.random()*2.1,
      born: performance.now(),
      life: 550 + Math.random()*450
    });
    if(!dustAnimating){ dustAnimating = true; requestAnimationFrame(dustLoop); }
  }

  function dustLoop(now){
    dustCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    dustParticles = dustParticles.filter(p => (now - p.born) < p.life);
    dustParticles.forEach(p=>{
      const t = (now - p.born) / p.life;
      const alpha = (1 - t) * 0.8;
      const x = p.x + p.vx * t;
      const y = p.y + p.vy * t;
      dustCtx.globalAlpha = alpha;
      dustCtx.fillStyle = '#9c3b22';
      dustCtx.fillRect(x, y, p.size, p.size);
    });
    dustCtx.globalAlpha = 1;
    if(dustParticles.length > 0){
      requestAnimationFrame(dustLoop);
    } else {
      dustAnimating = false;
    }
  }

  function spawnDustFromFrame(idx){
    const state = frameStates && frameStates[idx];
    if(!state) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const scrollY = window.scrollY;
    const phaseY = -(((scrollY % TILE_PX) + TILE_PX) % TILE_PX);
    const cols = Math.ceil(vw / TILE_PX) + 1;
    const rows = Math.ceil((vh - phaseY) / TILE_PX) + 1;
    const SPAWN_PER_TILE = 5;

    for(let row = 0; row < rows; row++){
      for(let col = -1; col < cols; col++){
        for(let s=0; s<SPAWN_PER_TILE; s++){
          let tries = 0;
          while(tries < 5){
            tries++;
            const tx = (Math.random()*TILE_RES) | 0;
            const ty = (Math.random()*TILE_RES) | 0;
            if(state[ty*TILE_RES + tx] === 1){
              const screenX = col*TILE_PX + (tx/TILE_RES)*TILE_PX;
              const screenY = phaseY + row*TILE_PX + (ty/TILE_RES)*TILE_PX;
              if(screenX > -20 && screenX < vw+20 && screenY > -20 && screenY < vh+20){
                spawnDustParticle(screenX, screenY);
              }
              break;
            }
          }
        }
      }
    }
  }

  let frameUrls = null;
  let frameStates = null;
  let currentFrame = -1;
  let ticking = false;

  // ---- idle crawl: a small amount of extra corrosion that creeps in on
  // its own while you sit still reading, on top of the normal scroll-
  // driven amount above. Scrolling itself still works exactly as before
  // (fast, direct); this only ever ADDS a small, slow bonus while nothing
  // is happening, and that bonus is capped well under one frame's worth
  // of progress (each of the 22 frames is ~4.5% of the full sweep), so
  // the most it can ever do on its own is nudge the edge forward by about
  // a single step — meant to be noticed only if you're staring at it, not
  // a visible animation. Any scroll event resets the idle clock back to
  // zero, so the crawl only ever measures time spent NOT scrolling.
  // must clear a full frame's width (1/FRAMES ≈ 0.045) with room to spare,
  // or sitting still right at a frame's own start would never visibly
  // advance at all — the cap is what guarantees at least one small step
  // eventually happens no matter where you're resting
  const IDLE_CAP = 1.3 / FRAMES;    // max extra progress idling alone can add (~1.3 frames)
  const IDLE_SECONDS_TO_CAP = 80;   // how long it takes to fully reach that cap (~1.3 min)
  let idleAnchorT = performance.now(); // timestamp of the most recent "stopped scrolling" moment
  let lastContinuousProgress = null; // last progress value rendered through the continuous path below

  // the SAME frame image does two jobs at once: as an alpha-only mask on
  // #page-wrap it cuts matching holes through both the white surface AND
  // the text in perfect sync; as corrosion-bg's own background-image its
  // RGB (invisible to the mask) is what actually paints the rust color
  // into the transition band.
  function applyFrameUrl(url){
    const cssUrl = `url(${url})`;
    pageWrap.style.maskImage = cssUrl;
    pageWrap.style.webkitMaskImage = cssUrl;
    corrosionBg.style.backgroundImage = cssUrl;
    corrosionBg.style.maskImage = cssUrl;
    corrosionBg.style.webkitMaskImage = cssUrl;
  }

  // ---------- cursor-following corrosion glow (decorative only) ----------
  // a soft rust-red smudge that trails the cursor and fades a moment after
  // it stops — purely a surface stain. This is NOT a second mask/reveal
  // layer (an earlier version was, and that's explicitly not what was
  // wanted): it never touches page-wrap's or corrosion-bg's mask, so the
  // paper never actually opens up under the cursor — it just looks like a
  // touch of corrosion passing through, drawn as real pixels on its own
  // canvas layered between the white paper and the text (same technique as
  // the dust-canvas burst above: a plain clear-and-redraw rAF loop that
  // stops itself once nothing is left to fade).
  const glowCanvas = document.getElementById('trail-glow-canvas');
  const glowCtx = glowCanvas.getContext('2d');
  let glowDPR = Math.min(2, window.devicePixelRatio || 1);
  let glowBlobs = []; // { x, y, born }
  let glowAnimating = false;

  function sizeGlowCanvas(){
    glowDPR = Math.min(2, window.devicePixelRatio || 1);
    glowCanvas.width = window.innerWidth * glowDPR;
    glowCanvas.height = window.innerHeight * glowDPR;
    glowCtx.setTransform(glowDPR, 0, 0, glowDPR, 0, 0);
  }
  sizeGlowCanvas();
  window.addEventListener('resize', sizeGlowCanvas);

  const GLOW_RADIUS = 80;               // px in viewport space, at the moment a blob is stamped (toned down from 110)
  const GLOW_LIFE = 1400;               // ms a single stamped blob takes to fully fade
  const GLOW_COLOR = 'rgba(167,58,30,'; // a rust-red pulled from the same palette as the scroll corrosion's mid-band
  const GLOW_SPAWN_GAP = 40;            // ms between stamps while moving — dense enough to read as a continuous trail, cheap enough to run forever

  function spawnGlow(x, y){
    glowBlobs.push({ x, y, born: performance.now() });
    if(glowBlobs.length > 60) glowBlobs.shift(); // a very fast swipe shouldn't pile up indefinitely
    if(!glowAnimating){ glowAnimating = true; requestAnimationFrame(glowLoop); }
  }

  function glowLoop(now){
    glowCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    glowBlobs = glowBlobs.filter(b => (now - b.born) < GLOW_LIFE);
    glowBlobs.forEach((b) => {
      const t = (now - b.born) / GLOW_LIFE;
      const alpha = Math.pow(1 - t, 1.6) * 0.35; // soft to start, fades out faster near the end (toned down from 0.55)
      const r = GLOW_RADIUS * (0.7 + t * 0.5);   // gently spreads as it fades, like a stain soaking outward
      const grad = glowCtx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      grad.addColorStop(0, GLOW_COLOR + alpha + ')');
      grad.addColorStop(1, GLOW_COLOR + '0)');
      glowCtx.fillStyle = grad;
      glowCtx.beginPath();
      glowCtx.arc(b.x, b.y, r, 0, Math.PI * 2);
      glowCtx.fill();
    });
    if(glowBlobs.length > 0){
      requestAnimationFrame(glowLoop);
    } else {
      glowAnimating = false;
    }
  }

  let lastGlowSpawn = 0;
  window.addEventListener('pointermove', (e) => {
    const now = performance.now();
    if(now - lastGlowSpawn < GLOW_SPAWN_GAP) return;
    lastGlowSpawn = now;
    spawnGlow(e.clientX, e.clientY);
  }, { passive:true });

  // scroll-driven path: swaps between the 22 cheap precomputed frames —
  // unchanged from before, still a couple of comparisons per scroll event,
  // no pixel work.
  function applyDiscreteFrame(idx){
    lastContinuousProgress = null; // next idle tick must render fresh, not assume it's still mid-crawl
    if(idx === currentFrame) return;
    currentFrame = idx;
    applyFrameUrl(frameUrls[idx]);
    spawnDustFromFrame(idx);
  }

  // idle-crawl path: instead of snapping straight to the next of the 22
  // precomputed frames (which reads as one abrupt jump), render a fresh
  // one-off frame at the EXACT in-between threshold for the current
  // progress, using the same noise field/dither/coloring as the
  // precomputed set so it lines up seamlessly with them. Called on a
  // slow periodic tick (not every scroll frame), so the per-pixel cost
  // stays cheap — same ballpark as building one of the 22 frames, which
  // already happens 22-at-once without jank.
  function applyContinuousFrame(progress){
    // skip imperceptible re-renders (e.g. once the idle bonus has capped
    // out and stopped changing) rather than redrawing an identical canvas
    if(lastContinuousProgress !== null && Math.abs(progress - lastContinuousProgress) < 0.0003) return;
    lastContinuousProgress = progress;
    currentFrame = -1; // no longer sitting on one of the discrete frames — next scroll must re-snap
    // same t->threshold mapping the 22 precomputed frames use (t = idx/(FRAMES-1)),
    // just driven continuously by progress instead of a snapped integer idx,
    // so a continuous frame and its neighboring discrete frames render
    // identically at matching positions with no visible seam
    const t = Math.min(1, progress * FRAMES / (FRAMES - 1));
    const { url } = renderCorrosionFrame(thresholdAt(t), t >= 1);
    applyFrameUrl(url);
    // no dust here on purpose — dust puffs are the signature of the fast,
    // active scroll-driven edge; a quiet background creep should stay quiet
  }

  function update(){
    ticking = false;
    const doc = document.documentElement;
    // same hero-height offset as the sphere's own scrollProgress() — the
    // corrosion reveal shouldn't start creeping in until you're actually
    // past the hero screen
    const heroH = window.innerHeight;
    const scrollable = Math.max(1, doc.scrollHeight - window.innerHeight - heroH);
    const base = Math.min(1, Math.max(0, (window.scrollY - heroH) / scrollable));
    const idleElapsed = (performance.now() - idleAnchorT) / 1000;
    const idleBonus = Math.min(IDLE_CAP, IDLE_CAP * (idleElapsed / IDLE_SECONDS_TO_CAP));
    const progress = Math.min(1, base + idleBonus);

    if(!frameUrls) return;

    if(idleBonus > 0){
      applyContinuousFrame(progress);
    } else {
      const idx = Math.min(FRAMES-1, Math.floor(progress * FRAMES));
      applyDiscreteFrame(idx);
    }
  }
  function requestUpdate(){
    if(!ticking){ ticking = true; requestAnimationFrame(update); }
  }

  // one single mask layer, tiling across the whole document and scrolling
  // with it normally — the same frame image on both page-wrap (cuts the
  // holes) and corrosion-bg (paints the rust color into them).
  pageWrap.style.maskRepeat = 'repeat';
  pageWrap.style.maskSize = TILE_PX + 'px ' + TILE_PX + 'px';
  pageWrap.style.webkitMaskRepeat = 'repeat';
  pageWrap.style.webkitMaskSize = TILE_PX + 'px ' + TILE_PX + 'px';
  corrosionBg.style.backgroundSize = TILE_PX + 'px ' + TILE_PX + 'px';
  corrosionBg.style.backgroundRepeat = 'repeat';
  corrosionBg.style.maskRepeat = 'repeat';
  corrosionBg.style.webkitMaskRepeat = 'repeat';
  corrosionBg.style.maskSize = TILE_PX + 'px ' + TILE_PX + 'px';
  corrosionBg.style.webkitMaskSize = TILE_PX + 'px ' + TILE_PX + 'px';

  // build tiles slightly after first paint so the initial (plain white,
  // scroll=0) view isn't delayed by this one-time setup cost. before the
  // first frame is ready, #page-wrap has no mask-image and corrosion-bg has
  // no background-image yet, so its background-color (solid white) is what
  // shows — exactly the correct "untouched" look at the top of the page.
  // the Three.js render loop now keeps the main thread continuously busy
  // (one WebGL frame after another), so genuine idle gaps can become rare —
  // a bare requestIdleCallback could end up waiting a long time. The
  // timeout option forces it to fire anyway once that long has passed,
  // same spirit as before (build this off the critical first-paint path)
  // but with a guaranteed upper bound.
  const schedule = window.requestIdleCallback
    ? (fn => window.requestIdleCallback(fn, { timeout: 1200 }))
    : (fn => setTimeout(fn, 0));
  schedule(()=>{
    const built = buildTiles();
    frameUrls = built.urls;
    frameStates = built.states;
    // once the real frames take over, drop the solid background-color —
    // otherwise it paints straight back over every hole the frame's own
    // alpha just opened, since both would sit on the same element.
    corrosionBg.style.backgroundColor = 'transparent';
    update();
  });

  window.addEventListener('scroll', ()=>{
    idleAnchorT = performance.now(); // actively scrolling — restart the idle clock
    requestUpdate();
  }, { passive:true });
  window.addEventListener('resize', ()=>{
    requestUpdate();
    sizeDustCanvas();
  });

  // nothing else drives update() while you're NOT scrolling, so a periodic
  // tick is what lets the idle crawl above actually render. Frequent
  // enough (every ~500ms) that the continuous in-between frames it
  // produces read as a slow, steady creep rather than discrete jumps;
  // each tick is cheap once the idle bonus caps out and stops changing
  // (applyContinuousFrame then skips the redraw entirely).
  setInterval(requestUpdate, 500);
})();

// ---- background music ----
// browsers block audio with sound from starting on page load without a
// user gesture, so playback is kicked off on the very first interaction
// of any kind (click, scroll, key, touch) rather than tied to any one
// control — the toggle button is there purely so the person can turn it
// back off (or on again) afterward, and reflects the real <audio> state
// rather than driving it blindly.
(function(){
  const bgm = document.getElementById('bgm');
  const toggle = document.getElementById('bgm-toggle');
  if(!bgm || !toggle) return;
  bgm.volume = 0.35;

  let userWantsMuted = false;

  function syncToggleLabel(){
    toggle.textContent = (bgm.paused || userWantsMuted) ? '♪' : '♫';
    toggle.style.opacity = (bgm.paused || userWantsMuted) ? '0.55' : '0.85';
  }

  function tryStart(){
    if(userWantsMuted || !bgm.paused) return;
    bgm.play().catch(() => {}); // a stray autoplay rejection here is harmless — the next gesture tries again
    syncToggleLabel();
  }

  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((evt) => {
    window.addEventListener(evt, tryStart, { passive:true, once:true });
  });

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if(bgm.paused){
      userWantsMuted = false;
      bgm.play().catch(() => {});
    } else {
      userWantsMuted = true;
      bgm.pause();
    }
    syncToggleLabel();
  });

  syncToggleLabel();
})();
</script>
</body>
</html>
